[theme]
base = "light"
primaryColor = "#1D4ED8"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1D4ED8"
codeBackgroundColor = "#F1F5F9"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 15
baseFontWeight = 400
metricValueFontWeight = 650
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
showWidgetBorder = true
showSidebarBorder = true
borderColor = "#CBD5E1"
dataframeBorderColor = "#CBD5E1"
dataframeHeaderBackgroundColor = "#E2E8F0"
dataframeHeaderTextColor = "#0F172A"
chartCategoricalColors = ["#2563EB", "#0F766E", "#D97706", "#7C3AED", "#DC2626", "#475569"]
paddingTop = "1.25rem"
paddingBottom = "2rem"

[theme.sidebar]
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
primaryColor = "#1D4ED8"
linkColor = "#1D4ED8"
borderColor = "#CBD5E1"
codeBackgroundColor = "#F1F5F9"
